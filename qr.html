<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --teal:#51897d; --gold:#d79068; --slate:#2f4f4f; --muted:#6b8c8c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Poppins',sans-serif; background:#f4f7f6; color:var(--slate); display:flex; justify-content:center; padding:24px; }
  .poster { background:#fff; width:100%; max-width:560px; border-radius:18px; padding:40px 32px; text-align:center; border:2px solid rgba(81,137,125,.25); }
  .brand { font-size:15px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--gold); }
  h1 { font-size:30px; line-height:1.2; margin:14px 0 6px; }
  .sub { font-size:15px; color:var(--muted); margin-bottom:24px; }
  .qr { width:320px; max-width:80%; margin:0 auto 24px; padding:14px; border:2px solid #e8efee; border-radius:16px; }
  .qr svg { display:block; width:100%; height:auto; }
  .steps { display:flex; gap:14px; text-align:left; margin-bottom:22px; }
  .steps div { flex:1; font-size:13px; line-height:1.5; }
  .steps b { display:block; color:var(--teal); font-size:20px; }
  @media (max-width:480px) { .steps { flex-direction:column; gap:10px; } .steps b { display:inline; margin-right:6px; } h1 { font-size:24px; } }
  .alt { font-size:13px; color:var(--muted); }
  .printbtn { margin-top:20px; padding:12px 22px; border:none; border-radius:10px; background:var(--teal); color:#fff; font:600 14px 'Poppins',sans-serif; cursor:pointer; }
  @media print { body { background:#fff; padding:0; } .poster { border:none; max-width:none; } .printbtn { display:none; } @page { margin:14mm; } }
</style>
